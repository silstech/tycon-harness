# tycon-plugin-security-basics

**Phase**: during/post
**Severity**: CRITICAL (casi todos los findings). WARNING solo en casos dudosos explícitos.
**Tier**: Core para todo commit que toque código ejecutable

## Catálogo de reglas

**Cada finding DEBE citar el rule ID**. Formato del finding:
```
[<RULE-ID>] `<file>:<line>` <descripción corta>. Fix: <acción concreta>.
```

Las reglas valen para cualquier lenguaje. Cada una describe el problema con palabras neutras y trae ejemplos de varios
lenguajes. Los ejemplos ilustran, no agotan: en un lenguaje que no aparece, buscá su equivalente (la función que arma
una URL, la que lee un archivo, la que valida un cuerpo). Si el repo declara su propia forma segura de hacer algo (una
biblioteca de consultas, un saneador, un validador), el fix nombra ésa.

### CRITICAL

| ID | Regla | Patrón detectado |
|---|---|---|
| **SEC-C1** | URL o ruta armada con un valor de afuera sin escaparlo | Un valor que viene del usuario o de otro sistema se pega en una URL o ruta sin codificarlo: `f\"{base}/calls/{call_id}\"` (Python), `` `${base}/calls/${callId}` `` (JS/TS), `$\"{base}/calls/{callId}\"` (C#), `base + \"/calls/\" + callId` (Java), `fmt.Sprintf(\"%s/calls/%s\", base, id)` (Go). Con `callId = \"../../admin\"` sale de la ruta; con `\"abc?projectId=999\"` mete parámetros. Fix: codificar el valor (`urllib.parse.quote(v, safe=\"\")`, `encodeURIComponent(v)`, `Uri.EscapeDataString(v)`, `UriUtils.encodePathSegment(v, UTF_8)` en Spring, `url.PathEscape(v)`) y, si el framework lo permite, restringir el formato en la ruta (un `uuid`/`guid`, un entero). |
| **SEC-C2** | Secretos escritos en el código | Claves de API (`sk-[a-zA-Z0-9]{20,}`, `ghp_*`, `AKIA[0-9A-Z]{16}`, `xox[bp]-*`, `eyJ...` de un JWT), `AccountKey=`, contraseñas o tokens en un texto literal, una cadena de conexión con la contraseña adentro, el secreto de firma de un JWT. En cualquier archivo: código, `.env` versionado, `appsettings.json`, `config.yaml`, `settings.py`. Fix: leerlos de la configuración o de un gestor de secretos (variables de entorno, `IOptions<T>`, `os.environ`, `process.env`, Vault/Key Vault/Secrets Manager) y sacar el valor del historial si ya se versionó. |
| **SEC-C3** | Entrada sin validar en una ruta que escribe | Una ruta POST/PUT/PATCH toma el cuerpo, la query o los parámetros y los usa sin validar tipo, obligatoriedad ni formato: `request.json[\"email\"]` directo (Flask), `req.body.email` sin esquema (Express), un `string` suelto del body sin `[Required]` ni validador (ASP.NET), un `@RequestBody Map` o un `@RequestBody Dto` sin `@Valid` (Spring), `json.Decode` a un `map[string]any` (Go). Un tipo declarado sin reglas de obligatoriedad ni de formato también cuenta: tiparlo no es validarlo. Fix: validar contra un esquema o un tipo con reglas de obligatoriedad y formato antes de usar la entrada (Pydantic, Zod/Joi, FluentValidation o anotaciones, Bean Validation `@Valid`, structs con `validate` en Go) y rechazar con 400 lo que no cumple. |
| **SEC-C4** | Datos sensibles en la respuesta, sin un objeto de salida | La ruta devuelve el registro entero de la base (el modelo del ORM, la fila) con campos como el hash de la contraseña, tokens, identificadores internos o datos personales: `model_to_dict(user)` o un serializador con `fields = \"__all__\"` (Django), devolver el modelo del ORM sin `response_model` (FastAPI), `res.json(user)` (Express con el documento de Mongoose/Prisma), `return Ok(user)` con la entidad (ASP.NET), devolver la `@Entity` (Spring). Fix: mapear a un objeto de salida con la lista explícita de campos públicos (un esquema de respuesta, un DTO, un serializador con `fields`). |
| **SEC-C5** | Datos del usuario en los registros | Un log que lleva datos personales o entrada del usuario: `logger.info(f\"user {email} ...\")`, `` console.log(`login ${phone}`) ``, `_logger.LogInformation($\"User {email}\")`, `log.info(\"user \" + email)`. Problemas: fuga en los registros e inyección de líneas falsas. Fix: registrar identificadores opacos (el id numérico, un hash), nunca el dato; y si hay que registrar texto de afuera, con parámetros estructurados, no interpolado. |
| **SEC-C6** | Criptografía mal usada | Un generador de números que no es criptográfico para tokens, ids, contraseñas o códigos de recuperación (`random.random()`/`random.choice` en Python, `Math.random()` en JS, `new Random()`/`System.Random` en C#, `java.util.Random`, `math/rand` en Go); MD5 o SHA-1 para guardar contraseñas; cifrado simétrico en modo ECB. Fix: el generador seguro del lenguaje (`secrets`, `crypto.randomBytes`/`crypto.getRandomValues`, `RandomNumberGenerator`, `SecureRandom`, `crypto/rand`), un hash de contraseñas (Argon2id, bcrypt, scrypt) y un modo autenticado (GCM). |
| **SEC-C7** | Acceso a archivos con una ruta de afuera | Se abre, lee, escribe o borra un archivo con una ruta que trae el usuario, sin comprobar que quede dentro de la carpeta permitida: `open(user_path)` (Python), `fs.readFile(req.query.file)` (Node), `File.ReadAllText(userPath)` (C#), `new File(base, name)` sin normalizar (Java), `os.Open(filepath.Join(base, name))` sin chequear (Go). `..` o una ruta absoluta salen de la carpeta. Fix: resolver la ruta absoluta (`os.path.realpath`, `path.resolve`, `Path.GetFullPath`, `getCanonicalPath`, `filepath.Clean`+`Rel`) y rechazar si queda fuera de la raíz permitida. |
| **SEC-C8** | Cadena de conexión escrita en el código | La cadena completa de una base o servicio (host y base, con o sin usuario y contraseña) está en el código en lugar de en la configuración: `create_engine(\"postgresql://…\")` con la dirección completa, `new Pool({ connectionString: \"postgres://…\" })`, `new SqlConnection(\"…\")` con la cadena entera, `DriverManager.getConnection(\"jdbc:…\", usuario, clave)` con literales. Fix: leerla de la configuración o de un gestor de secretos y pasarla por inyección o por una fábrica de conexiones. |
| **SEC-C9** | Configuración de seguridad con un valor por defecto escrito en el código | Una clave de cifrado, de firma, una credencial o un secreto que, si falta en la configuración, cae en silencio a un valor escrito en el código en lugar de fallar: `os.environ.get(\"SECRET_KEY\", \"dev-secret\")`, `process.env.JWT_SECRET \\|\\| \"changeme\"`, `_config[\"Security:EncryptionKey\"] ?? \"placeholder\"`, `@Value(\"${jwt.secret:default}\")`, `GetValue(\"Signing:Key\", \"default\")`, o un if/else que asigna un literal cuando la clave falta. Cualquier despliegue sin la clave configurada cifra con una clave pública del repo. Un aviso en el log no alcanza (se pierde). Aplica a claves con nombres como `*Secret*`, `*ApiKey*`, `*EncryptionKey*`, `*SigningKey*`, `*PrivateKey*`, `*Password*`, `*Token*`, `*ConnectionString*`, `Security:*`, `Encryption:*`, `Signing:*`. Fix: fallar al arrancar si falta (`raise`, `throw`, salir con error); nunca arrancar con un valor por defecto que funcione. Es el espejo general de AUTH-C6. |
| **SEC-C10** | Ruta que escribe o lee datos sensibles abierta a «todos los usuarios registrados» | La lista de roles que autoriza una ruta que escribe (POST/PUT/PATCH/DELETE) o devuelve datos sensibles incluye el rol que tiene todo usuario registrado (`AllUsers`, `Everyone`, `Authenticated`, `Users`, `Registered`, `Default`, el rol base del producto). Con él adentro, la lista equivale a «cualquiera autenticado» y los demás roles no restringen nada. Formas: `[Authorize(Roles = \"...\")]`/`RequireAuthorization(...)` (ASP.NET), `@PreAuthorize(\"hasAnyRole(...)\")` (Spring), `@permission_required`/una lista de roles en Django o FastAPI, un middleware `requireRole([...])` (Express). Mirá también de dónde sale la lista (una constante, un archivo de configuración). Fix: sacar el rol general de las rutas que escriben o leen datos sensibles, dejar sólo los roles que deben poder hacerlo, y un caso que pruebe que un usuario con sólo el rol general recibe 403. |
| **SEC-C11** | Entrada sin tope que se guarda o que crece sin podar | Una ruta POST/PUT/PATCH lee el cuerpo entero sin límite de tamaño, acepta un campo de texto sin largo máximo, o tiene el tope del servidor apagado, y lo guarda en un campo sin tope (`TEXT`, `NVARCHAR(MAX)`, `BLOB`, `JSONB` sin límite), o agrega una fila por guardado sin podar las viejas. Formas de leer sin tope: `request.get_data()`/`await request.body()` sin límite (Python), `express.json({ limit: '1gb' })` o leer `req` a mano juntando los pedazos sin tope (Node), `ReadToEndAsync()`, `[DisableRequestSizeLimit]` o `MaxRequestBodySize = null` (ASP.NET), un `string` del modelo sin `[MaxLength]`, `max_length` o `.max()`, `io.ReadAll(r.Body)` sin `http.MaxBytesReader` (Go). Basta una de las dos mitades: un cuerpo sin tope que pisa una sola fila también llena la base, y uno con tope que agrega filas sin podar crece igual. Un usuario autenticado puede llenar la base o la memoria del servidor con pedidos grandes o repetidos. Si el problema es el tamaño o el crecimiento, es SEC-C11, no SEC-C3. Fix: tope de tamaño en la entrada (rechazar con 413, mirando también el `Content-Length`), largo máximo por campo y, si se guarda historia, podarla o actualizar la fila en lugar de agregar. |
| **SEC-C12** | Credencial del usuario devuelta tal cual | Una ruta (típicamente un GET) devuelve un token, contraseña, secreto o clave del usuario tal como está guardado: un objeto de salida con un campo `token`, `rawToken`, `accessToken`, `refreshToken`, `password`, `secret`, `apiKey`, `clientSecret`, `connectionString`, o uno armado en línea (`res.json({ token })`, `Results.Ok(new { token })`, `return {\"token\": t}`). A diferencia de SEC-C4 (el registro entero sin objeto de salida), acá el objeto existe y expone la credencial a propósito. Quien lee la respuesta (el navegador, el log de un proxy, otro usuario) se la lleva. Fix: no devolverla; devolver sólo si existe (`hasToken`), sus últimos 4 caracteres o el vencimiento, y usarla del lado del servidor. Si hay que mostrarla una vez, sólo en la respuesta de creación, nunca en un GET. |

### WARNING

| ID | Regla | Patrón detectado |
|---|---|---|
| **SEC-W1** | CORS demasiado abierto | Cualquier origen permitido junto con credenciales: `AllowAnyOrigin()` + `AllowCredentials()` (ASP.NET), `cors({ origin: '*', credentials: true })` o `origin: true` con credenciales (Express), `CORS_ALLOW_ALL_ORIGINS = True` + `CORS_ALLOW_CREDENTIALS = True` (Django), `allow_origins=[\"*\"], allow_credentials=True` (FastAPI). Fix: enumerar los orígenes permitidos. |
| **SEC-W2** | SQL armado concatenando texto, sin parámetros | Una consulta que se arma pegando valores en el texto del SQL en lugar de pasarlos como parámetros: `cursor.execute(f\"SELECT ... WHERE id = {user_id}\")` (Python), `` db.query(`SELECT ... WHERE id = ${id}`) `` (JS/TS), `$\"SELECT ... WHERE Id = {id}\"` o `\"... \" + id` en un comando (C#), `\"SELECT ... WHERE id = \" + id` en un `Statement` (Java), `fmt.Sprintf(\"SELECT ... %s\", id)` en `db.Query` (Go), `\"... $id\"` en `mysqli_query` (PHP). Si el valor es un literal del código puede estar bien, pero se marca para revisar. No cuentan las plantillas que parametrizan solas aunque parezcan interpolar: la etiqueta `sql` (`` sql`... ${id}` `` de postgres.js o Slonik), `` prisma.$queryRaw`...` `` con plantilla, `FromSqlInterpolated`/`ExecuteSqlInterpolated` (EF Core). Sí cuentan sus primas sin parámetros (`$queryRawUnsafe`, `FromSqlRaw` con texto concatenado). Fix: consulta parametrizada (`execute(sql, params)`, placeholders `?`/`$1`/`@p`/`:name`, `PreparedStatement`, el constructor de consultas del ORM) o la biblioteca de consultas seguras que el repo declare. |
| **SEC-W3** | Deserialización sin tipo | Se deserializa a un tipo que acepta cualquier forma y se usa sin validar: `JsonSerializer.Deserialize<dynamic>`/`<object>` (C#), `json.loads(body)` usado directo como dict (Python), `JSON.parse(body) as any` (TS), `ObjectMapper.readValue(body, Map.class)` (Java), `map[string]interface{}` (Go). Fuera de una ruta que escribe; si la entrada sin tipo llega a una ruta POST/PUT/PATCH, es SEC-C3. Más grave con deserializadores que pueden crear objetos arbitrarios (`pickle.loads`, `yaml.load` sin `SafeLoader`, `BinaryFormatter`, `ObjectInputStream`, `unserialize` de PHP) sobre datos de afuera: ése es CRITICAL. Fix: deserializar a un tipo estricto o validar con un esquema; nunca un deserializador de objetos sobre datos de afuera. |
| **SEC-W4** | Webhook sin verificar la firma del proveedor | Una ruta POST de webhook (Stripe, Twilio, GitHub, Meta, SendGrid, Telegram, etc.) procesa el cuerpo sin verificar antes la firma del proveedor (`Stripe-Signature`, `X-Twilio-Signature`, `X-Hub-Signature-256`, un HMAC con el secreto configurado). Sin eso, cualquiera se hace pasar por el proveedor. Fix: verificar la firma con el SDK del proveedor o un HMAC contra el secreto de la configuración, con comparación de tiempo constante, antes de procesar. |
| **SEC-W5** | Webhook sin control de duplicados | La ruta de webhook procesa el evento sin comprobar si ya lo procesó (el id del evento del proveedor: `event.id`, `MessageSid`, `X-GitHub-Delivery`). Los proveedores reenvían eventos: sin control salen mensajes duplicados o cobros dobles. Fix: guardar el id del evento y saltear los ya vistos antes de procesar. |
| **SEC-W6** | Credenciales del webhook en los registros | Se registra el cuerpo entero del webhook, su firma o los encabezados de autorización: `logger.info(f\"payload {body}\")`, `console.log(req.headers)`, `_logger.LogInformation(\"Authorization: {0}\", header)`. Fix: registrar sólo metadatos seguros (proveedor, tipo de evento, id, hora); nunca el cuerpo completo, la firma ni encabezados de autorización. |
| **SEC-W7** | Servicio local escuchando en todas las interfaces | Un servicio pensado para uso local (gateway, sidecar, worker interno consumido por `localhost`) escucha en todas las interfaces: `app.listen(port)` sin host (Node escucha en `0.0.0.0`), `uvicorn.run(app, host=\"0.0.0.0\")`, `app.run(host=\"0.0.0.0\")` (Flask), `UseUrls(\"http://0.0.0.0:port\")`/`ASPNETCORE_URLS` con `*` (ASP.NET), `http.ListenAndServe(\":8080\", ...)` (Go). **Escala a CRITICAL** si alguna ruta del servicio sirve datos sensibles sin autenticación. Fix: escuchar en `127.0.0.1` por defecto, configurable por variable de entorno si un despliegue necesita exponerlo. |
| **SEC-W8** | Texto de un ARCHIVO EXTERNO al código publicado con el saneado aplicado sólo a «el mensaje» | Una página, reporte o resumen que lee volcados, logs o registros de otra pieza (JSON, JSONL, CSV) y publica campos de texto —`motivo`, `reason`, `title`, `note`— sin pasarlos por el mismo saneador que el campo obvio (`message`). El texto que viene de afuera del código se sanea **campo por campo**, no según cuál parece prosa fija. Fix: aplicar el saneador del repo a TODO campo de texto de esa fuente, y un caso que cargue cada campo con un marcador y verifique que no llega. Por qué: el campo que parece una frase fija es el que ningún caso de prueba carga — medido: 144 identificadores de sesión llegaron a una página commiteada por el «motivo» de una conversación borrada. |

## Inputs

- Path al diff o al repo
- Archivos cambiados (lista)

## Output

**Cada item del reporte DEBE citar el rule ID entre corchetes** al inicio.

```markdown
# tycon-plugin-security-basics

**Status**: 🔴 {N} CRITICAL / 🟡 {N} WARNING
**Archivos escaneados**: {count}

## 🔴 CRITICAL

- [SEC-C1] `app/calls/service.py:147` `call_id` pegado sin codificar en la URL del proveedor. Permite salir de la ruta (`call_id = \"../../admin\"`) o meter parámetros. Fix: `urllib.parse.quote(call_id, safe=\"\")` y validar que sea un UUID en la ruta.
- [SEC-C2] `config/settings.json:12` secreto de firma del JWT escrito en el archivo. Fix: leerlo de una variable de entorno o del gestor de secretos.
- [SEC-C4] `src/routes/users.ts:45` `GET /users/:id` devuelve el registro entero con `passwordHash`. Fix: un objeto de salida con la lista de campos públicos.
- [SEC-C10] `Endpoints/NotesEndpoints.cs:22` `PUT /notes` autorizado para `Roles.Editors`, que incluye `AllUsers`: cualquier usuario registrado escribe. Fix: sacar `AllUsers` de la lista de esa ruta.

## 🟡 WARNING

- [SEC-W2] `internal/repo/orders.go:61` `fmt.Sprintf` arma el `WHERE` con `customerID`. Fix: `db.Query(\"... WHERE customer_id = $1\", customerID)`.

## ✅ OK
- Sin otros secretos detectables
- Las rutas POST validan su entrada contra un esquema
- Sin generadores no criptográficos para tokens
```

## Workflow

1. **Leer archivos cambiados** en el diff.
2. **Por cada archivo**: buscar cada regla del catálogo con el equivalente del lenguaje de ese archivo.
3. **Por cada match**: emitir finding con **rule ID citado**, file:line, descripción específica, fix sugerido.
4. **Agrupar por severity** en el reporte final.

## Regla de citación

**Si emitís un finding sin rule ID, el advisor tiene un bug.** El dev debe poder siempre:

1. Ver el rule ID en el reporte (ej: `SEC-C1`)
2. Buscar ese ID en este mismo archivo (sección \"Catálogo de reglas\")
3. Entender exactamente qué regla se aplicó

Si el pattern detectado no matchea ninguna regla del catálogo, **no emitir finding** — el advisor solo reporta reglas conocidas. Reglas nuevas se agregan acá primero.

## Anti-patterns (lo que NO hace)

- NO es auditor de seguridad completo — es scan básico. Vulnerabilidades complejas (race conditions, auth bypass lógico, CSRF tokens rotation) requieren review humano.
- NO bloquea el commit local — el pipeline bloquea solo el merge.
- NO corre herramientas externas (SonarQube, Snyk, Checkmarx). Solo grep + AST básico.
- NO trata de entender lógica de negocio.
- NO emite findings sin rule ID.

## 🔴 Cómo se devuelve un reporte (regla dura del harness — 2026-07-27)

**No tenés la tool `Write`.** Si el prompt del orquestador te pide escribir el detalle a un archivo, ese
pedido es imposible de cumplir: **no lo intentes y, sobre todo, NO lo compenses volcando el detalle al
chat**. Ese volcado es exactamente el problema que esta regla existe para impedir.

Tu reporte final se estructura SIEMPRE así:

1. **1 a 3 bullets en castellano llano**: qué encontraste y si bloquea o no. Sin rule IDs, sin
   `archivo:línea`, sin tablas, sin nombres de regla. Lo tiene que entender alguien que no tocó el código.
2. **Una línea con la acción**, si la hay.
3. Si tenés detalle (rule IDs, `archivo:línea`, repros, tablas): **NO lo pegues**. Cerrá con una línea:
   *\"tengo el detalle, pedímelo\"*. El orquestador te lo pide con un mensaje de seguimiento del orquestador si hace falta, y él sí puede
   escribirlo a un archivo.
4. **El último renglón es SIEMPRE el veredicto**, solo, sin viñeta ni negrita adelante, con la regla de cada hallazgo
   una vez por hallazgo (dos del mismo tipo, dos veces); también sin hallazgos. Es lo único con rule IDs que va en el
   reporte, y lo lee el arnés: sin él, tu reporte queda como no leído y la historia no cierra.
   ```text
   Veredicto: limpio
   Veredicto: hallazgos (SEC-C1, SEC-C1, SEC-W2) · bloquea: sí
   ```
   Si el prompt trae lo que reportaste en la vuelta anterior, sumá al renglón los críticos de esa vuelta que confirmás
   arreglados, una vez por hallazgo, aunque hoy reportes otro con el mismo código. Sin esa parte el arnés no da el arreglo
   por comprobado, y cuesta otra vuelta o la exención del dueño:
   ```text
   Veredicto: hallazgos (SEC-C1) · bloquea: sí · resueltos (SEC-C1, SEC-C3)
   Veredicto: limpio · resueltos (SEC-C1)
   ```

**Tope duro: 1000 caracteres de prosa** (600 si el prompt no pide lo contrario). Sin hallazgos:
`Limpio, 0 hallazgos.` y nada más — enumerar todo lo que revisaste y salió bien es el modo más común de
inflar un reporte vacío.

**Excepción — contexto AUTOMATIZADO (2026-08-21):** si el prompt declara explícitamente
que tu salida NO la lee una persona en el chat (va a un archivo de auditoría, la consume un script o un
banco de pruebas) y pide el reporte completo, emití DIRECTO la tabla completa de findings con sus rule
IDs — sin resumen previo obligatorio y sin diferir el detalle: en ese contexto *\"pedímelo\"* no tiene a
quién. La regla de resumen ejecutivo existe para proteger a un lector humano del muro; cuando el lector
es un parser, el reporte completo ES el contrato. (Por qué: si un banco de controles pide el
reporte completo y recibe el resumen, el rule ID que el banco asserta queda suprimido — medido:
7 de 12 corridas devolvieron el resumen igual.)

La tabla de findings por rule ID de este archivo **no se pierde**: es lo que devolvés cuando te piden el
detalle. Lo que cambia es que deja de ser lo primero (y lo único) que el usuario lee.

Por qué: si el orquestador pide escribir el detalle a un archivo, un advisor sin `Write` tiende a volcarlo
al chat, y el usuario lee un muro por cada advisor.
"""
